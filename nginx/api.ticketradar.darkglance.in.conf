# ==============================================================================
# TicketRadar API - Nginx Reverse Proxy Configuration
# Domain: api.ticketradar.darkglance.in
# Backend: http://127.0.0.1:8000 (FastAPI / Uvicorn)
# ==============================================================================

# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream definition for FastAPI backend
upstream ticketradar_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server Block (Port 80)
# Handles Let's Encrypt ACME challenges and redirects all HTTP to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ticketradar.darkglance.in;

    # Allow ACME HTTP-01 challenge requests for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server Block (Port 443)
# Production SSL configuration & Reverse Proxy to FastAPI
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ticketradar.darkglance.in;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.ticketradar.darkglance.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ticketradar.darkglance.in/privkey.pem;

    # SSL Optimization & Modern Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (ensures faster and privacy-respecting SSL handshakes)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Dedicated Access & Error Logging
    access_log /var/log/nginx/ticketradar_api_access.log;
    error_log /var/log/nginx/ticketradar_api_error.log warn;

    # Upload size limits & buffer settings
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root ACME challenge location (fallback for HTTPS renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Reverse Proxy to FastAPI Backend
    location / {
        proxy_pass http://ticketradar_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & HTTP Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts and buffer sizes
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
